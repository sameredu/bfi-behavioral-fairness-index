[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfi-iabft"
version = "1.0.0"
description = "Behavioral Fairness Index (BFI) — Infrastructure-Aware Behavioral Fairness Theory for fair educational decision systems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Samer Yaghi", email = "syaghi@ucas.edu.ps" },
    { name = "Aiman A. AbuSamra" },
]
keywords = [
    "learning analytics",
    "algorithmic fairness",
    "educational data mining",
    "fair assessment",
    "behavioral fairness index",
    "moodle",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
data = ["pandas>=2.0", "openpyxl>=3.1"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/sameredu/iabft-behavioral-fairness-index"
Repository = "https://github.com/sameredu/iabft-behavioral-fairness-index"
Dataset = "https://doi.org/10.5281/zenodo.20366538"

[project.scripts]
bfi-iabft = "bfi_iabft.cli:main"

[tool.setuptools]
packages = ["bfi_iabft"]
